# Static analysis for the restaurant app. The lint set is very_good_analysis (decided 2026-11-12); the three strict
# language modes are repeated here so they stay on even if the package changes.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Generated by swagger_parser and build_runner; never edited by hand (api/ and docs/consuming-the-api.md).
    - lib/api/**
    - '**/*.g.dart'

formatter:
  page_width: 120

linter:
  rules:
    # Lines are 120 columns (.editorconfig and the formatter above); very_good_analysis asks for 80.
    lines_longer_than_80_chars: false
