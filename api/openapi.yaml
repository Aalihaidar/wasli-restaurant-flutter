openapi: 3.0.3
info:
  title: Wasli API
  version: 0.1.0
  description: 'The HTTP API of Wasli: order from the car through a chat with the
    restaurant.'
paths:
  /api/v1/config:
    get:
      operationId: config_retrieve
      description: 'The switches the apps need before anything else: the location
        rule, whether a restaurant must be online to be listed, whether the assistant
        is available, the languages and the polling interval. No token is needed.'
      summary: Read the public configuration
      tags:
      - config
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
          description: ''
  /api/v1/customers/login:
    post:
      operationId: customers_login
      description: Signs a customer in with an email address or a phone number and
        the password, and returns the customer token. `account_not_verified` until
        the sign-up code is verified (the app opens the code screen). Ten tries per
        contact in 15 minutes.
      summary: Sign in
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/customers/logout:
    post:
      operationId: customers_logout
      description: Revokes the token of this device. Other devices stay signed in.
      summary: Sign out
      tags:
      - customers
      security:
      - customerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '204':
          description: No response body
  /api/v1/customers/me:
    get:
      operationId: customers_me
      description: The customer's name, language and contacts, and whether each contact
        is verified.
      summary: Read the profile
      tags:
      - customers
      security:
      - customerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
          description: ''
  /api/v1/customers/me/contact:
    post:
      operationId: customers_contact_add
      description: 'Sends a code to the contact the account does not have yet: an
        email for a phone sign-up, a phone number for an email sign-up. It is saved
        only after `customers_contact_verify`. Changing a contact the account already
        has is not offered (`409 contact_already_set`); a contact that belongs to
        another account is `409 account_exists`.'
      summary: Add the missing contact
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      security:
      - customerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentCode'
          description: ''
  /api/v1/customers/me/contact/verify:
    post:
      operationId: customers_contact_verify
      description: Checks the code sent to the contact added with `customers_contact_add`,
        saves the contact as verified and returns the profile. `409 no_pending_contact`
        when none waits.
      summary: Confirm the added contact
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactVerifyRequest'
        required: true
      security:
      - customerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
          description: ''
  /api/v1/customers/password-reset:
    post:
      operationId: customers_password_reset
      description: Sends a six-digit code to the customer's **verified** contact.
        The answer is the same `202` whether or not an account exists, and the limits
        (one a minute, five an hour per contact) are the same too.
      summary: Ask for a password reset code
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetSent'
          description: ''
  /api/v1/customers/password-reset/confirm:
    post:
      operationId: customers_password_reset_confirm
      description: Checks the reset code and sets the new password. Every token of
        the customer is revoked, so every device signs in again. A password that is
        too weak is a `400` and does not spend the code.
      summary: Set a new password with the code
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '204':
          description: No response body
  /api/v1/customers/resend-code:
    post:
      operationId: customers_resend_code
      description: Sends a new code to an unverified account. A new code replaces
        the old one, comes at most every 60 seconds and at most 5 an hour per contact
        (`429 throttled` with `Retry-After`). A contact with no account, or an account
        already verified, gets the same `202` and nothing is sent.
      summary: Send a new sign-up code
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentCode'
          description: ''
  /api/v1/customers/signup:
    post:
      operationId: customers_signup
      description: Creates an unverified account from a name, **an email or a phone
        number**, a password and a language, and sends a six-digit code to that contact.
        The customer then calls `customers_verify`. Signing up again with a contact
        whose account is still unverified restarts the sign-up (new name, password
        and code); a contact of a verified account is `409 account_exists`. No token
        is needed.
      summary: Sign up
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentCode'
          description: ''
  /api/v1/customers/verify:
    post:
      operationId: customers_verify
      description: Checks the code sent at sign-up (valid 10 minutes, 5 wrong attempts).
        On success the contact is verified and the customer token is returned, **only
        here and at sign-in**. An unknown contact gets `code_invalid`, so the call
        reveals nothing.
      summary: Verify the sign-up code
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/restaurants/{slug}:
    get:
      operationId: restaurants_retrieve
      description: The restaurant's names, logo, brand colour, position and parking
        lot, the menu images the chat sends, and the structured menu (categories,
        items, option groups and options with their availability) that the item picker
        uses. A restaurant that is not active or whose subscription is suspended is
        a `404`. No token is needed.
      summary: Read a restaurant and its menu
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - restaurants
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetail'
          description: ''
  /api/v1/restaurants/nearby:
    get:
      operationId: restaurants_nearby
      description: Visible restaurants (active, subscription not suspended) whose
        parking lot is in range of the point (within the lot's radius of its centre),
        nearest first. `distance_m` is the distance to the restaurant itself. When
        none is in range, `restaurants` is empty and `nearest` holds the closest active
        restaurant. This list is polled and is not paginated. No token is needed.
      summary: List the restaurants around a point
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: Latitude of the customer, in degrees.
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: Longitude of the customer, in degrees.
        required: true
      tags:
      - restaurants
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
          description: ''
components:
  schemas:
    ChannelEnum:
      enum:
      - email
      - sms
      type: string
      description: |-
        * `email` - Email
        * `sms` - SMS
    ClientErrorEnum:
      enum:
      - client_error
      type: string
      description: '* `client_error` - Client Error'
    Config:
      type: object
      properties:
        location_check:
          allOf:
          - $ref: '#/components/schemas/LocationCheckEnum'
          description: |-
            How an order's location is checked: `off`, `warn` (recorded, never blocks) or `enforce`.

            * `off` - off
            * `warn` - warn
            * `enforce` - enforce
        require_screen_online:
          type: boolean
          description: 'True: a restaurant is listed only while its site is online.'
        ai_enabled:
          type: boolean
          description: 'False when the assistant is not available: use the item picker.'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguagesEnum'
          description: The languages of the product.
        poll_interval_seconds:
          type: integer
          description: How often the sites poll for new messages and orders.
      required:
      - ai_enabled
      - languages
      - location_check
      - poll_interval_seconds
      - require_screen_online
    ContactRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Give this or phone.
          maxLength: 254
        phone:
          type: string
          minLength: 1
          description: Give this or email.
          maxLength: 32
    ContactVerifyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: The six-digit code.
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
    CustomerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        email_verified:
          type: boolean
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        phone_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - email_verified
      - full_name
      - id
      - locale
      - phone
      - phone_verified
    Error400:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        attr:
          type: string
          nullable: true
      required:
      - attr
      - code
      - detail
    Error400Response:
      type: object
      description: '``validation_error``: invalid input. ``client_error``: an unreadable
        request body.'
      properties:
        type:
          $ref: '#/components/schemas/Error400ResponseTypeEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error400'
      required:
      - errors
      - type
    Error400ResponseTypeEnum:
      enum:
      - validation_error
      - client_error
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `client_error` - Client Error
    Error401:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode401Enum'
        detail:
          type: string
        attr:
          type: string
          nullable: true
      required:
      - attr
      - code
      - detail
    Error403:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode403Enum'
        detail:
          type: string
        attr:
          type: string
          nullable: true
