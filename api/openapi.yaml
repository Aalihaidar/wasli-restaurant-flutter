  /api/v1/customers/me/contact:
    post:
      operationId: customers_contact_add
      description: 'Sends a code to the contact the account does not have yet: an
        email for a phone sign-up, a phone number for an email sign-up. It is saved
        only after `customers_contact_verify`. Changing a contact the account already
        has is not offered (`409 contact_already_set`); a contact that belongs to
        another account is `409 account_exists`.'
