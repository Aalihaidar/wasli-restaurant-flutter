  /api/v1/restaurants/nearby:
    get:
      operationId: restaurants_nearby
      description: 'Visible restaurants (active, subscription not suspended) that
        serve the point, nearest first: the customer is within the platform search
        distance of the restaurant and, when the restaurant sets a service distance
        (`service_radius_m`), within that too. `distance_m` is the distance to the
        restaurant itself. When none is in range, `restaurants` is empty and `nearest`
        holds the closest active restaurant, so the app can say how far it is. `nearest`
        is absent when `restaurants` is not empty and when no restaurant is visible
        at all. This list is polled and is not paginated. No token is needed.'
      summary: List the restaurants around a point
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: Latitude of the customer, in degrees.
        required: true
      - in: query
        name: lng
        schema:
