  /api/v1/conversations/{id}/location:
    put:
      operationId: conversations_location_update
      description: The phone's position, sent by the app when the car question appears.
        It is kept on the conversation until the order is placed, the latest value
        wins, and it goes to the restaurant's staff with the order. `204` with no
        body. Allowed in any open step; a placed conversation is `409 invalid_action_for_state`
        and an expired one `409 conversation_expired`. A latitude outside -90 to 90,
        a longitude outside -180 to 180 or a negative `accuracy_m` is `400 invalid_location`.
        Another customer's conversation is a `404`.
      summary: Send the phone's position
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      security:
