  /api/v1/conversations/{id}/voice:
    post:
      operationId: conversations_voice_create
      description: 'One WAV clip of at most 60 seconds and 5 MB, with a `client_message_id`.
        The clip is read in memory, understood like a typed message and dropped: it
        is never stored, and only what was said stays on the customer''s message (`used_voice:
        true` and the `transcript`). The answer is the same as for a message, always
        `201`, and a replay of the same `client_message_id` returns the first result.
        A clip nobody could understand, and an assistant that is down, are not errors:
        the customer''s message is stored with an empty transcript and the bot answers
        in the chat (the second also makes `ai_available` false for a few minutes).
        `400` codes: `audio_too_long`, `audio_too_large` (the clip above 5 MB, or
        the whole request above 6 MB) and `unsupported_audio_format` (only WAV for
        now). Taken in every open step (the order, the car, the note and the review);
        a placed conversation is `409 invalid_action_for_state` and an expired one
        `409 conversation_expired`. A spoken yes at the review places the order, so
        `403 phone_not_verified` is possible there.'
      summary: Send a voice message
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceMessageRequest'
        required: true
      security:
      - customerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
