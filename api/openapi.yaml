openapi: 3.0.3
info:
  title: Wasli API
  version: 0.1.0
  description: 'The HTTP API of Wasli: order from the car through a chat with the
    restaurant.'
paths:
  /api/v1/auth/login:
    post:
      operationId: staff_login
      description: 'Signs in a member of a restaurant with the account''s username
        (an email address or a phone number also works) and the password, and returns
        the staff token. A wrong username or password, an inactive account and an
        account that is not an active member of a restaurant (a customer, the platform
        team) are all the same `401 authentication_failed`, and no token is created
        for them. The token belongs to the account, not to the device: signing in
        again returns the same token and signing out ends it everywhere. Ten tries
        a minute per address and ten wrong tries per username in 15 minutes.'
      summary: Sign a staff member in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: staff_logout
      description: Deletes the staff token. Because the token belongs to the account,
        every device of that account is signed out.
      summary: Sign a staff member out
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '204':
          description: No response body
  /api/v1/auth/password:
    post:
      operationId: staff_password_change
      description: 'Replaces the password of the signed-in member and clears `must_change_password`.
        The token stays valid. The new password follows the same strength rules as
        the admin and must differ from the current one: a wrong current password is
        a `400` on `current_password` (`password_incorrect`), a weak or unchanged
        new one is a `400` on `new_password` (`password_too_short`, `password_too_common`,
        `password_entirely_numeric`, `password_too_similar`, `password_unchanged`).
        Ten tries an hour. Every other staff call keeps working while `must_change_password`
        is true.'
      summary: Change the password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Incorrect authentication credentials.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Authentication credentials were not provided.
                      attr: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '204':
          description: No response body
  /api/v1/config:
    get:
      operationId: config_retrieve
      description: 'The switches the apps need before anything else: the location
        rule, whether a restaurant must be online to be listed, whether the assistant
        is available, the languages and the polling interval. No token is needed.'
      summary: Read the public configuration
      tags:
      - config
      security:
