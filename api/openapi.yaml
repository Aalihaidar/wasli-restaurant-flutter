                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: You do not have permission to perform this action.
                      attr: null
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409Response'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                    - code: throttled
                      detail: Request was throttled.
                      attr: null
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
          description: ''
  /api/v1/customers/login:
    post:
      operationId: customers_login
      description: Signs a customer in with an email address or a phone number and
