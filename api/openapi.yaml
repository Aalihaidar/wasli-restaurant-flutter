components:
  schemas:
    ActionEnum:
      enum:
      - confirm
      - edit
      - edit_field
      - choose
      - skip_note
      - set_lines
      - set_locale
      - restart
      type: string
      description: |-
        * `confirm` - confirm
        * `edit` - edit
        * `edit_field` - edit_field
        * `choose` - choose
        * `skip_note` - skip_note
        * `set_lines` - set_lines
        * `set_locale` - set_locale
        * `restart` - restart
    ChannelEnum:
      enum:
      - email
      - sms
      type: string
      description: |-
        * `email` - Email
        * `sms` - SMS
    Chat:
      type: object
      description: 'What every chat endpoint answers: the conversation and some of
        its messages.'
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required:
      - conversation
      - messages
