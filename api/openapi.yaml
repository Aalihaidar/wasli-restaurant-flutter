  /api/v1/conversations/{id}/messages:
    get:
      operationId: conversations_messages_list
      description: The messages with a `seq` greater than `after_seq`, oldest first,
        with the conversation. The app polls this every few seconds and appends by
        `seq`. It is not paginated. Another customer's conversation is a `404`.
      summary: Read the messages of a conversation
      parameters:
      - in: query
        name: after_seq
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Return only messages whose `seq` is greater than this. 0 returns
          all.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - customerAuth: []
      responses:
        '400':
          content:
