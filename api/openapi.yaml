            followed by its subcategories (the ones whose `parent_id` is its id),
            and each level is in display order. A menu has up to three levels. A hidden
            category hides everything inside it.'
      required:
      - brand_colour
      - currency
      - latitude
      - logo_url
      - longitude
      - menu
      - menu_images
      - name_ar
      - name_en
      - slug
    SendMessageRequest:
      type: object
      properties:
        client_message_id:
          type: string
          format: uuid
          description: 'Made by the app for every message and kept for a retry: sending
            it again returns the first result and never runs twice.'
        text:
          type: string
          minLength: 1
          description: What the customer typed, at most 500 characters (counted as
            Unicode code points after trimming). Give this or `action`, not both.
          maxLength: 500
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          description: |-
            A button the customer tapped. Give this or `text`, not both.

            * `confirm` - confirm
            * `edit` - edit
            * `edit_field` - edit_field
            * `choose` - choose
            * `skip_note` - skip_note
            * `set_lines` - set_lines
            * `set_locale` - set_locale
            * `restart` - restart
        field:
          allOf:
          - $ref: '#/components/schemas/FieldEnum'
          description: |-
            For `edit_field`: what to edit.

            * `items` - items
            * `car` - car
            * `note` - note
        value:
          type: string
          format: uuid
          description: 'For `choose`: the `value` of the button the customer tapped.'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PickedLineRequest'
          description: 'For `set_lines`: the whole order, as the item picker built
            it.'
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          description: |-
            For `set_locale`.

            * `en` - English
            * `ar` - Arabic
      required:
      - client_message_id
    SenderEnum:
      enum:
      - customer
      - bot
      - system
      type: string
      description: |-
        * `customer` - Customer
        * `bot` - Bot
        * `system` - System
    SentCode:
      type: object
      properties:
        identifier:
          type: string
          description: The contact the code was sent to, normalised.
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        code_expires_in_seconds:
          type: integer
          default: 600
        resend_available_in_seconds:
          type: integer
          default: 60
      required:
      - channel
      - identifier
    Session:
      type: object
      properties:
        token:
          type: string
          description: 'Sent as `Authorization: Customer <token>`. Shown only here
            and at sign-in.'
        customer:
          $ref: '#/components/schemas/CustomerProfile'
      required:
      - customer
      - token
    SignupRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          description: Give this or phone.
          maxLength: 254
        phone:
          type: string
          minLength: 1
          description: Give this or email.
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          description: |-
            The customer's language; the code message is written in it.

            * `en` - English
            * `ar` - Arabic
      required:
      - full_name
      - locale
      - password
    SourceEnum:
      enum:
      - gps
      - simulated
      type: string
      description: |-
        * `gps` - gps
        * `simulated` - simulated
    StaffLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracy_m:
          type: number
          format: double
          nullable: true
          description: How accurate the position is, in metres, when the phone said.
        source:
          type: string
          x-extensible-enum:
          - gps
          - simulated
          - none
          description: '`gps`, or `simulated` for the test button on staging. A list
            that can grow: treat a value you do not know as unknown.'
        captured_at:
          type: string
          format: date-time
          nullable: true
      required:
      - accuracy_m
      - captured_at
      - lat
      - lng
      - source
    StaffLoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: The account's username. An email address or a phone number
            also works.
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    StaffMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/StaffRoleEnum'
          description: |-
            The member's role at this restaurant. A list that can grow.

            * `admin` - Admin
            * `cashier` - Cashier
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/StaffPermissionEnum'
          description: What the member may do. Hide an action the list does not allow;
            the server stays the authority.
        must_change_password:
          type: boolean
          description: 'True for a new member with a temporary password: ask for a
            new one with `POST /auth/password`.'
        restaurant:
          $ref: '#/components/schemas/StaffRestaurant'
      required:
      - full_name
      - id
      - must_change_password
      - permissions
      - restaurant
      - role
      - username
    StaffOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: The restaurant's own order number.
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        placed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 'Moves on every change to the order. Merge by `id` and keep
            the latest: an order can arrive again unchanged, with the same value.'
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: When the order was accepted or rejected; null while it is placed.
        eta_minutes:
          type: integer
          nullable: true
          description: The wait the restaurant gave when it accepted (5, 10 or 15),
            else null.
        rejection_reason_code:
          type: string
          nullable: true
          x-extensible-enum:
          - item_unavailable
          - too_busy
          - closing_soon
          - too_far
          - location_unclear
          - other
          description: 'Why the restaurant rejected the order, else null. A list that
            can grow: treat a code you do not know as unknown.'
        rejection_note:
          type: string
          nullable: true
          description: The restaurant's note with a rejection (always there for `other`),
            else null.
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffOrderItem'
        customer_note:
          type: string
          description: The customer's note for the whole order, or empty.
        subtotal_minor:
          type: integer
        total_minor:
          type: integer
        currency:
          type: string
        vehicle:
          $ref: '#/components/schemas/StaffVehicle'
        parking_note:
          type: string
          description: Where the car is, as the customer said it. Present for a car
            order.
        customer_location:
          $ref: '#/components/schemas/StaffLocation'
        distance_m:
          type: integer
          nullable: true
          description: Metres from the customer to the restaurant; null without a
            position.
        distance_band:
          allOf:
          - $ref: '#/components/schemas/DistanceBandEnum'
          description: |-
            `in_lot` within the restaurant's service distance, `near`, `far`, or `unknown` without a position. A list that can grow.

            * `in_lot` - in_lot
            * `near` - near
            * `far` - far
            * `unknown` - unknown
      required:
      - currency
      - customer_note
      - decided_at
      - distance_band
      - distance_m
      - eta_minutes
      - id
      - items
      - number
      - order_type
      - placed_at
      - rejection_note
      - rejection_reason_code
      - status
      - subtotal_minor
      - total_minor
      - updated_at
    StaffOrderItem:
      type: object
      properties:
        line:
          type: integer
          description: The line's number in the order, from 1.
        name_en:
          type: string
        name_ar:
          type: string
        quantity:
          type: integer
        unit_price_minor:
          type: integer
          description: The item's price with its options, in fils.
        options:
          type: array
          items:
            $ref: '#/components/schemas/StaffOrderOption'
        note:
          type: string
          description: The customer's note on the line, or empty.
        line_total_minor:
          type: integer
      required:
      - line
      - line_total_minor
      - name_ar
      - name_en
      - note
      - options
      - quantity
      - unit_price_minor
    StaffOrderList:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
          description: Send it back as `since` on the next call.
        orders:
          type: array
          items:
            $ref: '#/components/schemas/StaffOrder'
      required:
      - orders
      - server_time
    StaffOrderOption:
      type: object
      properties:
        name_en:
          type: string
        name_ar:
          type: string
        price_delta_minor:
          type: integer
          description: The change to the item's price, in fils.
      required:
      - name_ar
      - name_en
      - price_delta_minor
    StaffPasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    StaffPermissionEnum:
      type: string
      description: |-
        * `orders.view` - orders.view
        * `orders.decide` - orders.decide
        * `menu.edit` - menu.edit
        * `members.manage` - members.manage
        * `restaurant.settings` - restaurant.settings
        * `reports.view` - reports.view
      x-extensible-enum:
      - orders.view
      - orders.decide
      - menu.edit
      - members.manage
      - restaurant.settings
      - reports.view
    StaffRestaurant:
      type: object
      properties:
        slug:
          type: string
        name_en:
          type: string
        name_ar:
          type: string
          description: The Arabic name, or the English name when there is no Arabic
            one.
        logo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        service_radius_m:
          type: integer
          description: Metres from the restaurant that it serves cars. Absent when
            the restaurant sets no limit.
        currency:
          type: string
      required:
      - currency
      - latitude
      - logo_url
      - longitude
      - name_ar
      - name_en
      - slug
    StaffRoleEnum:
      type: string
      description: |-
        * `admin` - Admin
        * `cashier` - Cashier
      x-extensible-enum:
      - admin
      - cashier
    StaffToken:
      type: object
      properties:
        token:
          type: string
          description: 'Send it as `Authorization: Token <token>` on every staff call.'
      required:
      - token
    StaffVehicle:
      type: object
      properties:
        plate:
          type: string
        model:
          type: string
        colour:
          type: string
      required:
      - colour
      - model
      - plate
    VerifyRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          description: The email address or the phone number, as the customer typed
            it.
          maxLength: 254
        code:
          type: string
          minLength: 1
          description: The six-digit code.
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
      - identifier
    VoiceMessageRequest:
      type: object
      properties:
        client_message_id:
          type: string
          format: uuid
          description: Made by the app for every message and kept for a retry, as
            for a text.
        audio:
          type: string
          format: binary
          description: 'One WAV clip of at most 60 seconds and 5 MB. It is read in
            memory and never stored: only what was said stays on the message, as its
            transcript.'
      required:
      - audio
      - client_message_id
  securitySchemes:
    customerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Customer token, sent as `Customer <token>`. It is returned once,
        when a sign-up is verified or a customer signs in.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
