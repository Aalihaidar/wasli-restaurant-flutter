          description: ''
    post:
      operationId: conversations_messages_create
      description: 'One customer input: `text` (at most 500 characters) or an `action`,
        never both. The answer holds the customer''s own message and the bot''s replies,
        always `201`; sending the same `client_message_id` again returns the first
        result, also `201`. A missing or invalid answer is handled by the bot in the
        conversation, not as an error. An action that is not allowed at this step
        is `409 invalid_action_for_state`; a conversation past its expiry is `409
        conversation_expired`.'
      summary: Send a message or tap a button
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
